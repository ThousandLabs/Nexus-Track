const addMonth=(m,d)=>{let [y,mo]=m.split('-').map(Number);mo+=d;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+'-'+pad(mo)};
const initials=s=>String(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
const slug=s=>String(s||'x').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';
function fmt(n){return new Intl.NumberFormat('fr-FR').format(Math.round(n||0))+' '+((db&&db.shared&&db.shared.currency)||'F')}
function longDate(d){return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function dayLabel(d){const t=today();const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+pad(y.getMonth()+1)+'-'+pad(y.getDate());if(d===t)return "Aujourd'hui";if(d===ys)return 'Hier';return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function ago(ts){if(!ts)return 'jamais';const m=Math.round((Date.now()-ts)/60000);if(m<1)return "à l'instant";if(m<60)return 'il y a '+m+' min';const h=Math.round(m/60);if(h<24)return 'il y a '+h+' h';return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){toast('⚠️ Impossible d\'enregistrer (stockage plein ou bloqué)');return false}}

/* ---------- Activation ---------- */
function rnd(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>ALPHA[x%32]).join('')}
function deviceId(){let id=lsGet(DKEY);if(!id||!/^NX-[A-Z2-9]{4}-[A-Z2-9]{4}$/.test(id)){const r=rnd(8);id='NX-'+r.slice(0,4)+'-'+r.slice(4);lsSet(DKEY,id)}return id}
function normCode(c){const x=String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');return x.length===8?x.slice(0,4)+'-'+x.slice(4):x}
function unb64u(t){t=String(t).replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
let LICENSED=false;
const cleanSig=c=>String(c||'').replace(/\s+/g,'').replace(/^NXCODE:/i,'');
async function checkCode(code){try{const c=cleanSig(code);if(!c||!(window.crypto&&crypto.subtle))return false;const k=await crypto.subtle.importKey('jwk',PUBKEY,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,unb64u(c),new TextEncoder().encode(deviceId()))}catch(e){return false}}
function isActivated(){return LICENSED}

/* ---------- Données ---------- */
function defaultDB(){return {v:1,me:null,ws:null,mode:'team',centralizer:false,theme:'auto',lastSentAt:0,lastReceivedAt:0,needRedistribute:false,syncLog:[],
  shared:{bizName:'',pctIntervenant:50,goal:0,currency:'F',updatedAt:0,by:null},services:[],members:[],sales:[],expenses:[],fixed:[]}}
function load(){try{const d=JSON.parse(lsGet(KEY));if(d&&d.v){const b=defaultDB();const r=Object.assign(b,d);r.shared=Object.assign(defaultDB().shared,d.shared||{});LISTS.forEach(k=>{if(!Array.isArray(r[k]))r[k]=[]});return r}}catch(e){}return defaultDB()}
let db=load();
function save(){lsSet(KEY,JSON.stringify(db))}
function stamp(r){r.updatedAt=Date.now();r.by=db.me?db.me.id:null;return r}
function stampShared(){db.shared.updatedAt=Date.now();db.shared.by=db.me.id}
function upsert(list,rec){stamp(rec);const i=db[list].findIndex(x=>x.id===rec.id);if(i>=0)db[list][i]=rec;else db[list].push(rec);save();return rec}
function removeRec(list,id){const r=db[list].find(x=>x.id===id);if(r){r.deleted=true;stamp(r);save()}}
const isTeam=()=>db.mode==='team';
const isBoss=()=>!isTeam()||db.centralizer;
const canEdit=r=>isBoss()||r.authorId===db.me.id;
const memberName=(id,fb)=>(db.members.find(m=>m.id===id)||{}).name||fb||'?';
function pctFor(s){const v=db.services.find(x=>x.id===s.serviceId);if(v&&v.pct!==''&&v.pct!=null&&!isNaN(+v.pct))return +v.pct;return +db.shared.pctIntervenant}
function ensureMembers(){const ids=new Set(db.members.map(m=>m.id));[...alive(db.sales),...alive(db.expenses)].forEach(r=>{if(r.memberId&&!ids.has(r.memberId)){db.members.push({id:r.memberId,name:r.memberName||'Membre',weight:1,active:true,updatedAt:0,by:null});ids.add(r.memberId)}})}
function pendingCount(){if(!db.me)return 0;let n=0;LISTS.forEach(k=>{n+=db[k].filter(r=>r.by===db.me.id&&r.updatedAt>db.lastSentAt).length});if(db.shared.by===db.me.id&&db.shared.updatedAt>db.lastSentAt)n++;return n}
function logSync(txt){db.syncLog.unshift({at:Date.now(),txt});db.syncLog=db.syncLog.slice(0,20)}

/* ---------- Période & calculs ---------- */
let view='home', period=curMonth(), salesFilter={q:'',f:'all'}, pendingSend=null;
const inPeriod=d=>period==='all'||String(d).slice(0,7)===period;
function fixedInMonth(m){return sum(alive(db.fixed).filter(f=>f.startMonth<=m&&(!f.endMonth||f.endMonth>=m)),f=>f.amount)}
function fixedTotal(){if(period!=='all')return fixedInMonth(period);const ms=[...alive(db.sales).map(s=>s.date.slice(0,7)),...alive(db.expenses).map(e=>e.date.slice(0,7)),...alive(db.fixed).map(f=>f.startMonth)].filter(Boolean).sort();if(!ms.length)return 0;let m=ms[0],t=0,g=0;const end=curMonth();while(m<=end&&g++<600){t+=fixedInMonth(m);m=addMonth(m,1)}return t}
function stats(){
  const sales=alive(db.sales).filter(s=>inPeriod(s.date)), exps=alive(db.expenses).filter(e=>inPeriod(e.date));
  const ca=sum(sales,s=>s.amount), cost=sum(sales,s=>s.cost), credit=sum(sales.filter(s=>s.status==='credit'),s=>s.amount);
  const varExp=sum(exps,e=>e.amount), fixed=fixedTotal(), charges=varExp+fixed, net=ca-cost-charges;
  const members=alive(db.members), per={};
  members.forEach(m=>per[m.id]={m,count:0,ca:0,direct:0,share:0,total:0});
  let commune=0;
  sales.forEach(s=>{const marge=(+s.amount||0)-(+s.cost||0), p=pctFor(s)/100;
    if(!per[s.memberId])per[s.memberId]={m:{id:s.memberId,name:s.memberName,weight:0,active:false},count:0,ca:0,direct:0,share:0,total:0};
    const x=per[s.memberId];x.count++;x.ca+=+s.amount||0;x.direct+=marge*p;commune+=marge*(1-p)});
  const communeNet=commune-charges, act=members.filter(m=>m.active!==false), W=sum(act,m=>m.weight);
  act.forEach(m=>{if(W>0)per[m.id].share=communeNet*(+m.weight||0)/W});
  const list=Object.values(per).map(x=>(x.total=x.direct+x.share,x)).filter(x=>x.count>0||x.m.active!==false).sort((a,b)=>b.total-a.total);
  const bySvc={}, byMethod={};
  sales.forEach(s=>{const k=s.label;bySvc[k]=bySvc[k]||{label:k,count:0,amount:0};bySvc[k].count+=+s.qty||1;bySvc[k].amount+=+s.amount||0;byMethod[s.method]=(byMethod[s.method]||0)+(+s.amount||0)});
  return {sales,exps,ca,cost,credit,varExp,fixed,charges,net,commune,communeNet,per:list,top:Object.values(bySvc).sort((a,b)=>b.amount-a.amount),byMethod};
}

/* ---------- Synchro : paquets ---------- */
function b64enc(b){let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(t){const s=atob(t);const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
async function viaStream(bytes,ts){return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ts)).arrayBuffer())}
async function pack(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));if(window.CompressionStream){try{return 'NXT1Z.'+b64enc(await viaStream(raw,new CompressionStream('deflate')))}catch(e){}}return 'NXT1J.'+b64enc(raw)}
async function unpack(text){
  text=String(text||'').trim();
  const m=text.match(/NXT1([ZJ])\.([A-Za-z0-9+/=\s]+)/);
  if(!m){try{return JSON.parse(text)}catch(e){throw new Error('Code non reconnu. Colle tout le message reçu.')}}
  let bytes;try{bytes=b64dec(m[2].replace(/\s/g,''))}catch(e){throw new Error('Code abîmé ou incomplet')}
  if(m[1]==='Z'){if(!window.DecompressionStream)throw new Error('Navigateur trop ancien pour lire ce code. Utilise le fichier.');try{bytes=await viaStream(bytes,new DecompressionStream('deflate'))}catch(e){throw new Error('Code abîmé ou incomplet')}}
  return JSON.parse(new TextDecoder().decode(bytes));
}
function buildPackage(kind){
  const pick=r=>kind==='full'||(r.by===db.me.id&&r.updatedAt>db.lastSentAt);
  const data={};LISTS.forEach(k=>data[k]=db[k].filter(pick));
  const shared=(kind==='full'||(db.shared.by===db.me.id&&db.shared.updatedAt>db.lastSentAt))?db.shared:null;
  return {app:'nexus-track',v:1,kind,ws:db.ws,from:db.me,at:Date.now(),shared,data};
}
function mergeList(local,incoming){const map=new Map(local.map(r=>[r.id,r]));let added=0,updated=0;
  (incoming||[]).forEach(r=>{if(!r||!r.id)return;const cur=map.get(r.id);if(!cur){map.set(r.id,r);if(!r.deleted)added++}else if((r.updatedAt||0)>(cur.updatedAt||0)){map.set(r.id,r);updated++}});
  return {list:[...map.values()],added,updated}}
async function doImport(text,joining){
  let pkg;try{pkg=await unpack(text)}catch(e){toast('❌ '+e.message);return false}
  if(pkg&&pkg.app==='nexus-track-backup'){if(joining){toast('❌ Ceci est une sauvegarde, pas un paquet d\'équipe');return false}return restoreBackup(pkg)}
  if(!pkg||pkg.app!=='nexus-track'||!pkg.data){toast('❌ Ce n\'est pas un paquet Nexus Track');return false}
  if(db.ws&&pkg.ws&&db.ws!==pkg.ws){const nm=(pkg.shared&&pkg.shared.bizName)||(pkg.from&&pkg.from.name)||'inconnu';if(!confirm('Ce paquet vient d\'un autre espace (« '+nm+' »).\nLe fusionner quand même dans le tien ?'))return false}
  if(!db.ws)db.ws=pkg.ws;
  let added=0,updated=0;
  LISTS.forEach(k=>{const r=mergeList(db[k],pkg.data[k]);db[k]=r.list;added+=r.added;updated+=r.updated});
  if(pkg.shared&&(pkg.shared.updatedAt||0)>(db.shared.updatedAt||0)){db.shared=Object.assign({},db.shared,pkg.shared);updated++}
  ensureMembers();db.lastReceivedAt=Date.now();
  if(isTeam()&&db.centralizer&&added+updated>0)db.needRedistribute=true;
  logSync('📥 Reçu de '+((pkg.from&&pkg.from.name)||'?')+' : '+added+' nouveau(x), '+updated+' mis à jour');
  save();if(!joining){closeModal();render();toast('✅ '+added+' ajout(s), '+updated+' mise(s) à jour')}
  return true;
}
function restoreBackup(b){if(!b||b.app!=='nexus-track-backup'||!b.db){toast('❌ Fichier de sauvegarde invalide');return false}
  if(!confirm('Restaurer cette sauvegarde du '+new Date(b.at).toLocaleString('fr-FR')+' ?\nToutes les données actuelles de ce téléphone seront remplacées.'))return false;
  const n=defaultDB();db=Object.assign(n,b.db);db.shared=Object.assign(defaultDB().shared,b.db.shared||{});LISTS.forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});
  save();closeModal();render();toast('✅ Sauvegarde restaurée');return true}

async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copié ✅');return true}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();toast(ok?'Copié ✅':'Copie impossible, sélectionne le texte à la main');return ok}}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
async function shareText(text,title){if(navigator.share){try{await navigator.share({title:title||'Nexus Track',text});return true}catch(e){if(e.name==='AbortError')return false}}window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');return true}
async function shareFile(name,text){try{const f=new File([text],name,{type:'text/plain'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}}catch(e){if(e.name==='AbortError')return false}download(name,text,'text/plain');toast('Fichier téléchargé : envoie-le sur WhatsApp 📎');return true}
function waPhone(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===9)d='221'+d;return d}

/* ---------- QR code : générateur intégré (hors ligne) + lecteur caméra ---------- */
const QR=(()=>{
  const ECC={L:[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],M:[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28]};
  const BLK={L:[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],M:[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49]};
  const FMT={L:1,M:0};
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const rawModules=v=>{let r=(16*v+128)*v+64;if(v>=2){const na=Math.floor(v/7)+2;r-=(25*na-10)*na-55;if(v>=7)r-=36}return r};
  const dataCw=(v,e)=>Math.floor(rawModules(v)/8)-ECC[e][v]*BLK[e][v];
  const alignPos=v=>{if(v===1)return [];const na=Math.floor(v/7)+2,size=v*4+17,step=v===32?26:Math.ceil((v*4+4)/(na*2-2))*2,r=[6];for(let p=size-7;r.length<na;p-=step)r.splice(1,0,p);return r};
  const rsDiv=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r};
  const rsRem=(data,div)=>{const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=mul(c,f)})}return r};
  const MASKS=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  function penalty(M,n){let p=0,dark=0;
    for(let a=0;a<n;a++){let rr=1,rc=1;for(let b=1;b<=n;b++){if(b<n&&M[a][b]===M[a][b-1])rr++;else{if(rr>=5)p+=rr-2;rr=1}if(b<n&&M[b][a]===M[b-1][a])rc++;else{if(rc>=5)p+=rc-2;rc=1}}}
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(M[y][x])dark++;if(y<n-1&&x<n-1){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}}
    return p+Math.max(0,Math.ceil(Math.abs(dark*20-n*n*10)/(n*n))-1)*10}
  function encode(text,e){e=e||'L';const bytes=Array.from(new TextEncoder().encode(text));let v=1,cap=0;
    for(;v<=40;v++){cap=dataCw(v,e)*8;if(4+(v<10?8:16)+bytes.length*8<=cap)break}
    if(v>40)throw new Error('Données trop longues pour un QR code');
    const bits=[],put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
    put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
    const nb=BLK[e][v],el=ECC[e][v],raw=Math.floor(rawModules(v)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb),div=rsDiv(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-el+(i<nShort?0:1));k+=dat.length;const ec=rsRem(dat,div);if(i<nShort)dat.push(0);blocks.push(dat.concat(ec))}
    const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-el||j>=nShort)all.push(b[i])});
    const size=v*4+17,M=Array.from({length:size},()=>new Array(size).fill(false)),F=Array.from({length:size},()=>new Array(size).fill(false));
    const setF=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
    [[3,3],[size-4,3],[3,size-4]].forEach(([cx,cy])=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const xx=cx+dx,yy=cy+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size){const d=Math.max(Math.abs(dx),Math.abs(dy));setF(xx,yy,d!==2&&d!==4)}}});
    const ap=alignPos(v),na=ap.length;
    for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setF(ap[i]+dx,ap[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
    const drawFmt=m=>{const d=FMT[e]<<3|m;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++)setF(8,i,g(i));setF(8,7,g(6));setF(8,8,g(7));setF(7,8,g(8));for(let i=9;i<15;i++)setF(14-i,8,g(i));
      for(let i=0;i<8;i++)setF(size-1-i,8,g(i));for(let i=8;i<15;i++)setF(8,size-15+i,g(i));setF(8,size-8,true)};
    drawFmt(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const bt=((b>>>i)&1)!==0,a=size-11+i%3,c=Math.floor(i/3);setF(a,c,bt);setF(c,a,bt)}}
    let idx=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;if(!F[y][x]&&idx<all.length*8){M[y][x]=((all[idx>>>3]>>>(7-(idx&7)))&1)!==0;idx++}}}
    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&MASKS[m](x,y))M[y][x]=!M[y][x]};
    let best=0,bp=Infinity;for(let m=0;m<8;m++){apply(m);drawFmt(m);const p=penalty(M,size);if(p<bp){bp=p;best=m}apply(m)}
    apply(best);drawFmt(best);return M}
  function canvas(text,px,e){const q=encode(text,e),n=q.length,quiet=4,total=n+quiet*2,scale=Math.max(2,Math.floor((px||300)/total)),c=document.createElement('canvas');
    c.width=c.height=total*scale;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';
    for(let y=0;y<n;y++)for(let xx=0;xx<n;xx++)if(q[y][xx])x.fillRect((xx+quiet)*scale,(y+quiet)*scale,scale,scale);c.className='qr';return c}
  return {encode,canvas};
})();

/* Lecteur : BarcodeDetector (Android/Chrome) sinon jsQR chargé à la demande (puis gardé hors ligne) */
let scanStream=null,scanTimer=null;
function loadJsQR(){return new Promise((ok,ko)=>{if(window.jsQR)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=()=>window.jsQR?ok():ko();s.onerror=ko;document.head.appendChild(s)})}
async function startScan(video,status,onText){
  stopScan();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status.textContent='📵 Caméra non disponible ici. Ouvre l\'appli installée (site en https).';return}
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){status.textContent='📵 Accès à la caméra refusé. Autorise-le dans les réglages du navigateur.';return}
  video.setAttribute('playsinline','');video.muted=true;video.srcObject=scanStream;try{await video.play()}catch(e){}
  let detect=null;
  if('BarcodeDetector' in window){try{const bd=new BarcodeDetector({formats:['qr_code']});detect=async()=>{const r=await bd.detect(video);return r.length?r[0].rawValue:null}}catch(e){detect=null}}
  if(!detect){status.textContent='Chargement du lecteur…';try{await loadJsQR()}catch(e){status.textContent='❌ Lecteur QR indisponible hors ligne sur ce téléphone. Utilise le message ou le fichier.';stopScan();return}
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    detect=async()=>{const w=video.videoWidth,h=video.videoHeight;if(!w)return null;const s=Math.min(1,720/Math.max(w,h));cv.width=w*s|0;cv.height=h*s|0;cx.drawImage(video,0,0,cv.width,cv.height);const r=window.jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});return r?r.data:null}}
  if(!scanStream)return;
  status.textContent='🎯 Vise le QR code…';
  let busy=false;scanTimer=setInterval(async()=>{if(busy||!scanStream)return;busy=true;try{const t=await detect();if(t)onText(t)}catch(e){}busy=false},160);
}
function stopScan(){clearInterval(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}

function salesList(){

  if(q)list=list.filter(s=>[s.label,s.client,s.phone,memberName(s.memberId,s.memberName),s.note].join(' ').toLowerCase().includes(q));
  if(!list.length)return '<div class="empty"><div class="e">🔎</div>Aucune vente trouvée.</div>';
  list.sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));

function scanModal(title,hint,onText){modal(sheetHead(title)+'<p class="muted small cm">'+hint+'</p><div class="scanbox"><video id="scanV"></video><i></i></div><p id="scanS" class="small cm">Ouverture de la caméra…</p><div id="scanDots" class="dots"></div><button class="btn block" data-act="close">Annuler</button>');startScan($('#scanV'),$('#scanS'),onText)}
function multiCollector(done){const parts={};let pid=null,need=0,fin=false;return t=>{if(fin)return;t=String(t).trim();
  if(/^NXT1[ZJ]\./.test(t)){fin=true;stopScan();done(t);return}
  const m=t.match(/^NXQ1\/(\w+)\/(\d+)\/(\d+)\/(.+)$/);if(!m)return;
  if(pid!==m[1]){pid=m[1];need=+m[3];Object.keys(parts).forEach(k=>delete parts[k])}
  if(!parts[m[2]]){parts[m[2]]=m[4];try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}}
  const got=Object.keys(parts).length,d=$('#scanDots'),s=$('#scanS');
  if(d)d.innerHTML=Array.from({length:need},(_,i)=>'<b class="'+(parts[i+1]?'on':'')+'"></b>').join('');
  if(s)s.textContent='📥 '+got+' / '+need+' codes reçus…';
  if(got===need){fin=true;stopScan();done(Array.from({length:need},(_,i)=>parts[i+1]).join(''))}}}
let installEvt=null;
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function installHTML(){if(isStandalone())return '<div class="small">✅ Appli installée sur ce téléphone</div>';if(installEvt)return '<button class="btn pri block" data-act="install">📲 Installer l\'appli sur mon téléphone</button>';
  return '<p class="muted small">📲 Pour installer l\'appli : '+(isIOS()?'dans Safari, touche <b>Partager</b> puis <b>« Sur l\'écran d\'accueil »</b>.':'menu <b>⋮</b> de Chrome puis <b>« Installer l\'application »</b> ou <b>« Ajouter à l\'écran d\'accueil »</b>.')+'</p>'}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;const s=$('#installSlot');if(s)s.innerHTML=installHTML()});
addEventListener('appinstalled',()=>{installEvt=null;const s=$('#installSlot');if(s)s.innerHTML=installHTML();toast('Nexus Track installé 🎉')});

/* ---------- Actions ---------- */
const ACT={
  sendQR:()=>{if(!pendingSend)return;const code=pendingSend.code,CH=500,n=Math.ceil(code.length/CH),pid=rnd(4);
    const parts=n===1?[code]:Array.from({length:n},(_,i)=>'NXQ1/'+pid+'/'+(i+1)+'/'+n+'/'+code.slice(i*CH,(i+1)*CH));
    let cvs;try{cvs=parts.map(t=>QR.canvas(t,660))}catch(e){toast('❌ '+e.message);return}
    let cur=0,playing=true;
    modal(sheetHead('🔳 Fais scanner ce QR code')+'<p class="muted small cm">Sur l\'autre téléphone : <b>'+(isTeam()?'Équipe':'Sync')+' › Recevoir › 📷 Scanner</b>.'+(n>1?'<br>Les '+n+' codes défilent tout seuls : garde la caméra pointée jusqu\'à ce que tous les points soient verts.':'')+'</p><div id="qrBox"></div><div class="cm"><b id="qrPart"></b></div>'+(n>1?'<div class="btns"><button class="btn" data-act="qrPrev">‹</button><button class="btn" data-act="qrPlay" id="qrPlayBtn">⏸️ Pause</button><button class="btn" data-act="qrNext">›</button></div>':'')+'<button class="btn pri block" data-act="qrDone">✅ L\'autre téléphone a tout reçu</button><p class="muted small cm">💡 Monte la luminosité de ton écran.</p>');
    const show=()=>{const b=$('#qrBox');if(!b)return;b.innerHTML='';b.appendChild(cvs[cur]);const l=$('#qrPart');if(l)l.textContent=n>1?'Code '+(cur+1)+' / '+n:''};
    qrCtl={next(){cur=(cur+1)%n;show()},prev(){cur=(cur-1+n)%n;show()},toggle(){playing=!playing;const b=$('#qrPlayBtn');if(b)b.textContent=playing?'⏸️ Pause':'▶️ Lecture'}};
    show();if(n>1)qrAnim=setInterval(()=>{if(playing)qrCtl.next()},850)},
  qrPrev:()=>qrCtl&&qrCtl.prev(),qrNext:()=>qrCtl&&qrCtl.next(),qrPlay:()=>qrCtl&&qrCtl.toggle(),
  qrDone:()=>markSent(),
  scanRecv:()=>scanModal('📷 Scanner un QR code','Vise le QR code affiché sur l\'autre téléphone.',multiCollector(code=>doImport(code))),
  scanJoin:()=>scanModal('📷 Scanner la base de l\'équipe','Le responsable affiche le QR code (Équipe › Toute la base › QR code).',multiCollector(code=>{closeModal();const ta=document.querySelector('form[data-form=onboard] [name=code]');if(ta)ta.value=code;toast('Base reçue ✅ Appuie sur « C\'est parti »')})),
  showIdQR:()=>{const id=deviceId();modal(sheetHead('🔳 Ton ID appareil')+'<p class="muted small cm">Le vendeur scanne ce QR code avec Nexus Admin.</p><div id="qrBox"></div><div class="devid cm">'+id+'</div>');$('#qrBox').appendChild(QR.canvas('NXID:'+id,600,'M'))},
  scanCode:()=>scanModal('📷 Scanner le code','Vise le QR code affiché par le vendeur.',async t=>{if(scanModal.busy)return;scanModal.busy=true;const c=cleanSig(t);const ok=await checkCode(c);scanModal.busy=false;
    if(ok){stopScan();lsSet(AKEY,c);LICENSED=true;closeModal();render();toast('Nexus Track activé 🎉')}else{const s=$('#scanS');if(s)s.textContent='❌ Ce code ne correspond pas à ce téléphone'}}),
  install:async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;const s=$('#installSlot');if(s)s.innerHTML=installHTML()},
  go:t=>{view=t.dataset.v;scrollTo(0,0);render()},
  per:t=>{period=addMonth(period,+t.dataset.d);render()},
  perToggle:()=>{period=period==='all'?curMonth():'all';render()},
  newSale:()=>saleForm(),
  saleDetail:t=>saleDetail(t.dataset.id),
  editSale:t=>saleForm(t.dataset.id),
  paySale:t=>{const s=db.sales.find(x=>x.id===t.dataset.id);if(s){s.status='paid';upsert('sales',s);closeModal();render();toast('Paiement enregistré ✅')}},
  delSale:t=>{if(!confirm('Supprimer cette vente ?'))return;removeRec('sales',t.dataset.id);closeModal();render();toast('Vente supprimée')},
  receipt:t=>{const s=db.sales.find(x=>x.id===t.dataset.id);if(!s)return;
    const txt='🧾 *Reçu — '+(db.shared.bizName||'Nexus Track')+'*\n'+cap(longDate(s.date))+'\n\n'+s.label+(s.qty>1?' × '+s.qty:'')+' : *'+fmt(s.amount)+'*\nPaiement : '+(METHODS[s.method]||'')+(s.status==='credit'?' (⚠️ reste à payer)':' ✅')+(s.client?'\nClient : '+s.client:'')+'\n\nMerci pour votre confiance 🙏';
    if(s.phone)window.open('https://wa.me/'+waPhone(s.phone)+'?text='+encodeURIComponent(txt),'_blank');else shareText(txt,'Reçu')},
  pickSvc:t=>{const f=t.closest('form');f.querySelectorAll('.svc').forEach(b=>b.classList.toggle('on',b===t));const id=t.dataset.id;f.elements.serviceId.value=id;
    if(id){const v=db.services.find(x=>x.id===id);if(v){f.elements.label.value=v.name;f.elements.unit.value=v.price;f.elements.cost.value=(+v.cost||0)*(Math.max(1,+f.elements.qty.value||1))}}else{f.elements.label.value='';f.elements.cost.value=0;f.elements.label.focus()}updateTotal(f)},
  close:()=>closeModal(),
  copy:t=>copyText(t.dataset.t),
  filt:t=>{salesFilter.f=t.dataset.f;render()},
  goCredit:()=>{view='sales';salesFilter.f='credit';render()},
  openSend:t=>openSend(t.dataset.k),
  sendShare:async()=>{if(!pendingSend)return;if(await shareText(pendingSend.msg,'Nexus Track'))markSent()},
  sendFile:async()=>{if(!pendingSend)return;if(await shareFile(pendingSend.fname,pendingSend.msg))markSent()},
  sendCopy:async()=>{if(!pendingSend)return;if(await copyText(pendingSend.msg))markSent()},
  receive:()=>receiveModal(),
  pasteInto:async t=>{const sel=t.dataset.target;const el=sel.startsWith('#')?$(sel):t.closest('form').elements[sel];try{el.value=await navigator.clipboard.readText();toast('Collé ✅')}catch(e){el.focus();toast('Appui long dans la zone › Coller')}},
  doReceive:()=>{const v=$('#rcvText').value.trim();if(!v){toast('Colle d\'abord le message reçu');return}doImport(v)},
  shareReport:()=>shareText(reportText(),'Bilan'),
  expenseForm:t=>expenseForm(t.dataset.id),
  delExpense:t=>{if(!confirm('Supprimer cette dépense ?'))return;removeRec('expenses',t.dataset.id);closeModal();render()},
  fixedForm:t=>fixedForm(t.dataset.id),
  stopFixed:t=>{const f=db.fixed.find(x=>x.id===t.dataset.id);if(f){f.endMonth=curMonth();upsert('fixed',f);closeModal();render();toast('Charge arrêtée à partir du mois prochain')}},
  delFixed:t=>{if(!confirm('Supprimer cette charge fixe ? Elle disparaîtra aussi des mois passés. Pour garder l\'historique, utilise plutôt « Arrêter ».'))return;removeRec('fixed',t.dataset.id);closeModal();render()},
  memberForm:t=>memberForm(t.dataset.id),
  invite:()=>modal(sheetHead('➕ Inviter un membre')+'<ol class="steps"><li>Il ouvre Nexus Track sur son téléphone et l\'active avec <b>son propre code</b>.</li><li>Au démarrage, il choisit <b>« 🤝 Rejoindre une équipe »</b>.</li><li>Tu lui envoies la <b>base complète</b> avec le bouton ci-dessous. Il colle le message, et c\'est fini !</li></ol><button class="btn pri block" data-act="openSend" data-k="full">📦 Envoyer la base complète</button>'),
  serviceForm:t=>serviceForm(t.dataset.id),
  delService:t=>{if(!confirm('Supprimer ce service du catalogue ? Les ventes déjà enregistrées ne changent pas.'))return;removeRec('services',t.dataset.id);closeModal();render()},
  toTeam:()=>{db.mode='team';db.centralizer=true;save();render();toast('Mode équipe activé 👥')},
  backup:()=>{download('nexus-sauvegarde-'+slug(db.shared.bizName||'nexus')+'-'+today()+'.json',JSON.stringify({app:'nexus-track-backup',v:1,at:Date.now(),device:deviceId(),db}));toast('Sauvegarde téléchargée 💾')},
  reset:()=>{if(!confirm('Effacer TOUTES les données de ce téléphone ?'))return;if(!confirm('Vraiment sûr ? Cette action est définitive (la licence reste active).'))return;try{localStorage.removeItem(KEY)}catch(e){}db=defaultDB();view='home';render();toast('Données effacées')}
};
const FORMS={
  activate:async fd=>{const c=cleanSig(fd.get('code'));if(!(window.crypto&&crypto.subtle)){toast('Ouvre l\'appli depuis son lien https pour l\'activer');return}if(await checkCode(c)){lsSet(AKEY,c);LICENSED=true;render();toast('Nexus Track activé 🎉')}else toast('❌ Code invalide pour cet appareil (copie-le en entier)')},
  onboard:async fd=>{const name=String(fd.get('name')||'').trim();if(!name)return;
    if(fd.get('obmode')==='join'){const code=String(fd.get('code')||'').trim();if(!code){toast('Colle le message envoyé par le responsable');return}
      db.me={id:uid(),name};db.mode='team';db.centralizer=false;
      if(!(await doImport(code,true))){db.me=null;db.ws=null;return}
      upsert('members',{id:db.me.id,name,weight:1,active:true});save();view='home';render();toast('Bienvenue dans « '+(db.shared.bizName||'l\'équipe')+' » 🎉 Envoie tes ventes au responsable chaque soir.');return}
    db.me={id:uid(),name};db.ws=uid();db.mode=fd.get('mode')==='solo'?'solo':'team';db.centralizer=true;db.shared.bizName=String(fd.get('biz')||'').trim()||name;stampShared();
    upsert('members',{id:db.me.id,name,weight:1,active:true});
    (TEMPLATES[fd.get('tpl')]||TEMPLATES.vide).items.forEach(([n,p,c])=>upsert('services',{id:uid(),name:n,price:p,cost:c,pct:'',active:true}));
    save();view='home';render();toast('Espace créé 🎉 Appuie sur + pour ta première vente')},
  sale:(fd,f)=>{const id=f.dataset.id,old=id?db.sales.find(x=>x.id===id):null,unit=Math.max(0,+fd.get('unit')||0),qty=Math.max(1,Math.round(+fd.get('qty')||1));
    const memberId=fd.get('memberId')||(old?old.memberId:db.me.id),m=db.members.find(x=>x.id===memberId);
    const rec=Object.assign({},old||{id:uid(),createdAt:Date.now(),authorId:db.me.id},{date:fd.get('date')||today(),serviceId:fd.get('serviceId')||'',label:String(fd.get('label')).trim(),unit,qty,amount:unit*qty,cost:Math.max(0,+fd.get('cost')||0),method:fd.get('method')||'cash',status:fd.get('status')==='credit'?'credit':'paid',client:String(fd.get('client')||'').trim(),phone:String(fd.get('phone')||'').trim(),note:String(fd.get('note')||'').trim(),memberId,memberName:m?m.name:db.me.name});
    upsert('sales',rec);closeModal();render();toast(old?'Vente modifiée ✅':'Vente ajoutée ✅ '+fmt(rec.amount))},
  expense:(fd,f)=>{const id=f.dataset.id,old=id?db.expenses.find(x=>x.id===id):null,memberId=fd.get('memberId')||(old?old.memberId:db.me.id),m=db.members.find(x=>x.id===memberId);
    upsert('expenses',Object.assign({},old||{id:uid(),createdAt:Date.now(),authorId:db.me.id},{label:String(fd.get('label')).trim(),amount:Math.max(0,+fd.get('amount')||0),date:fd.get('date')||today(),cat:fd.get('cat'),note:String(fd.get('note')||'').trim(),memberId,memberName:m?m.name:db.me.name}));closeModal();render();toast('Dépense enregistrée ✅')},
  fixed:(fd,f)=>{const id=f.dataset.id,old=id?db.fixed.find(x=>x.id===id):null;const s=fd.get('startMonth')||curMonth(),e=fd.get('endMonth')||'';if(e&&e<s){toast('La date de fin doit être après le début');return}
    upsert('fixed',Object.assign({},old||{id:uid(),createdAt:Date.now(),authorId:db.me.id},{label:String(fd.get('label')).trim(),amount:Math.max(0,+fd.get('amount')||0),startMonth:s,endMonth:e}));closeModal();render();toast('Charge fixe enregistrée ✅')},
  member:(fd,f)=>{const m=db.members.find(x=>x.id===f.dataset.id);if(!m)return;m.name=String(fd.get('name')).trim()||m.name;m.weight=Math.max(0,+fd.get('weight')||0);m.active=!!fd.get('active');if(m.id===db.me.id)db.me.name=m.name;upsert('members',m);closeModal();render();toast('Membre mis à jour ✅')},
  service:(fd,f)=>{const id=f.dataset.id,old=id?db.services.find(x=>x.id===id):null,pct=String(fd.get('pct')).trim();
    upsert('services',Object.assign({},old||{id:uid()},{name:String(fd.get('name')).trim(),price:Math.max(0,+fd.get('price')||0),cost:Math.max(0,+fd.get('cost')||0),pct:pct===''?'':Math.min(100,Math.max(0,+pct)),active:!!fd.get('active')}));closeModal();render();toast('Catalogue mis à jour ✅')},
  profile:fd=>{const name=String(fd.get('name')||'').trim();if(name&&name!==db.me.name){db.me.name=name;const m=db.members.find(x=>x.id===db.me.id);if(m){m.name=name;upsert('members',m)}}
    if(isBoss()){const biz=String(fd.get('biz')||'').trim(),goal=Math.max(0,+fd.get('goal')||0),cur=String(fd.get('currency')||'').trim()||'F';
      if(biz!==db.shared.bizName||goal!==+db.shared.goal||cur!==db.shared.currency){Object.assign(db.shared,{bizName:biz,goal,currency:cur});stampShared()}}
    save();render();toast('Enregistré ✅')},
  rule:fd=>{if(!isBoss())return;db.shared.pctIntervenant=Math.min(100,Math.max(0,+fd.get('pct')||0));stampShared();save();render();toast('Règle enregistrée ✅ Pense à l\'envoyer à l\'équipe')}
};

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const fn=ACT[t.dataset.act];if(fn){e.preventDefault();fn(t,e)}});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();const fn=FORMS[f.dataset.form];if(fn)fn(new FormData(f),f)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){salesFilter.q=t.value;$('#salesList').innerHTML=salesList();return}
  const f=t.form;if(f&&f.dataset.form==='sale'&&(t.name==='unit'||t.name==='qty')){if(t.name==='qty'){const v=db.services.find(x=>x.id===f.elements.serviceId.value);if(v&&+v.cost)f.elements.cost.value=+v.cost*Math.max(1,+t.value||1)}updateTotal(f)}
  if(t.name==='pct'&&f&&f.dataset.form==='rule'){const p=+t.value;$('#pctA').textContent=p+' %';$('#pctB').textContent=(100-p)+' %';$('#pctEx').innerHTML=ruleExample(p)}});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.name==='obmode'){$('#ob-create').classList.toggle('hidden',t.value!=='create');$('#ob-join').classList.toggle('hidden',t.value!=='join')}
  if(t.name==='theme'){db.theme=t.value;save();applyTheme()}
  if(t.name==='appmode'){const was=db.mode;db.mode=t.value;if(t.value==='team'&&was!=='team')db.centralizer=true;save();render()}
  if(t.name==='centralizer'){db.centralizer=t.checked;save();render();toast(t.checked?'Tu es maintenant le responsable':'Tu es maintenant membre')}
  if(t.dataset.file&&t.files&&t.files[0]){const txt=await t.files[0].text();const kind=t.dataset.file;t.value='';
    if(kind==='join'){t.closest('form').elements.code.value=txt;toast('Fichier chargé ✅ Appuie sur « C\'est parti »')}
    else if(kind==='receive')doImport(txt);
    else if(kind==='restore'){let b;try{b=JSON.parse(txt)}catch(_){toast('❌ Fichier illisible');return}restoreBackup(b)}}});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(db.theme==='auto')applyTheme()})}catch(e){}
addEventListener('storage',e=>{if(e.key===KEY){db=load();render()}});

/* ---------- PWA : hors ligne + installation ---------- */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

ensureMembers();render();
(async()=>{const c=lsGet(AKEY);if(c&&await checkCode(c)){LICENSED=true;render()}})();
</script>
</body>
